name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler l'APK
        run: gradle assembleDebug
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Balise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Balise-apk
          path: Balise.apk
      - name: Publier une release (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Balise.apk

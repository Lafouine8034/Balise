name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'une release existante où ajouter l'APK (ex. v0.2.0), facultatif"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Retire espaces, retours à la ligne, tabulations et guillemets copiés par erreur
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"')
            echo "Longueur du secret : ${#CLEAN} caractères"
            echo "Caractères interdits : $(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)"
            echo "Reste modulo 4 : $(( ${#CLEAN} % 4 ))"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/balise.jks"; then
              echo "::error::Le secret KEYSTORE_BASE64 n'est pas du base64 valide. Régénérez-le avec : base64 -w0 balise.jks"
              exit 1
            fi
            echo "KEYSTORE_PATH=$RUNNER_TEMP/balise.jks" >> "$GITHUB_ENV"
          fi
      - name: Compiler l'APK signé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/*.apk Balise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Balise-apk
          path: Balise.apk
      - name: Publier une release (si tag v* / V*, ou tag donné à la main)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: Balise.apk
